name: Verify examples

on:
  push:
    branches: [main]
    paths: ['examples/**', '.github/workflows/verify-examples.yml']
  pull_request:
    paths: ['examples/**', '.github/workflows/verify-examples.yml']

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: examples/swift
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test core logic
        run: swift test
      - name: Build UIKit examples for iOS Simulator
        run: xcodebuild -scheme UIKitExamples -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/react
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/react/package-lock.json
      - run: npm ci
      - run: npm test
