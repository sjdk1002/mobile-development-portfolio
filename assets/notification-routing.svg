<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title">
<title id="title">앱 시작 단계에 맞춘 채팅 알림 진입</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#136b60"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#1c3038">
<rect x="30" y="38" width="280" height="104" rx="12" fill="#eef4f0"/>
<text x="170.0" y="97.0" text-anchor="middle" fill="#1c3038">알림의 채널 ID 보관</text>
<path d="M 310 90 H 350" fill="none" stroke="#136b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="360" y="38" width="280" height="104" rx="12" fill="#eef4f0"/>
<text x="500.0" y="97.0" text-anchor="middle" fill="#1c3038">앱 초기 진입 완료</text>
<path d="M 640 90 H 680" fill="none" stroke="#136b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="690" y="38" width="280" height="104" rx="12" fill="#136b60"/>
<text x="830.0" y="82.5" text-anchor="middle" fill="#fff">홈 라우팅에서</text>
<text x="830.0" y="111.5" text-anchor="middle" fill="#fff">대상 채팅 열기</text>
</g></svg>
