<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title">
<title id="title">브랜드 역할 사용자 기준의 캐시와 진행 중 요청 관리</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#136b60"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#1c3038">
<rect x="300" y="25" width="400" height="80" rx="12" fill="#eef4f0"/>
<text x="500.0" y="72.0" text-anchor="middle" fill="#1c3038">브랜드 · 역할 · 사용자 키</text>
<rect x="300" y="150" width="400" height="80" rx="12" fill="#eef4f0"/>
<text x="500.0" y="197.0" text-anchor="middle" fill="#1c3038">유효한 캐시가 있나?</text>
<path d="M 500 105 V 140" fill="none" stroke="#136b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="300" width="300" height="80" rx="12" fill="#136b60"/>
<text x="190.0" y="347.0" text-anchor="middle" fill="#fff">캐시 결과 재사용</text>
<rect x="590" y="300" width="360" height="80" rx="12" fill="#eef4f0"/>
<text x="770.0" y="347.0" text-anchor="middle" fill="#1c3038">같은 키의 요청이 진행 중?</text>
<path d="M 500 230 V 260 H 190 V 290" fill="none" stroke="#136b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250" y="250" font-size="17" fill="#5b7076">있음</text>
<path d="M 500 260 H 770 V 290" fill="none" stroke="#136b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="630" y="250" font-size="17" fill="#5b7076">없음</text>
<rect x="430" y="460" width="250" height="80" rx="12" fill="#136b60"/>
<text x="555.0" y="507.0" text-anchor="middle" fill="#fff">Promise 공유</text>
<rect x="720" y="460" width="250" height="80" rx="12" fill="#136b60"/>
<text x="845.0" y="507.0" text-anchor="middle" fill="#fff">새 요청</text>
<path d="M 770 380 V 415 H 555 V 450" fill="none" stroke="#136b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="560" y="405" font-size="17" fill="#5b7076">진행 중</text>
<path d="M 770 415 H 845 V 450" fill="none" stroke="#136b60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="850" y="405" font-size="17" fill="#5b7076">없음</text>
</g></svg>
